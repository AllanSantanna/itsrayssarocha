<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <script>
      try {
        const dark = localStorage.getItem("itsrayssa-theme") === "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) {
          document.querySelector('meta[name="theme-color"]').content =
            "#1c1b19";
        }
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <meta
      name="description"
      content="Aprenda inglês com a teacher Rayssa Rocha. Aulas particulares online, interativas e pensadas para o seu ritmo, com foco na comunicação."
    />
    <title>ItsRayssa Rocha — Inglês do seu jeito</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Ative o JavaScript para conhecer as aulas da teacher Rayssa. Você também
      pode entrar em contato pelo WhatsApp: (81) 98836-6734.</noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
